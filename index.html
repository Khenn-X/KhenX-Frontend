<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="KhenX — Nigeria's first AI-powered property listing and neighbourhood intelligence platform for Lagos." />
  <meta name="theme-color" content="#0A1628" />
  <title>KhenX — Property & Neighbourhoods</title>
</head>

<body>
  <div id="root"></div>
  <script>
    if (window.location.pathname === '/' && !window.location.hash) {
      window.history.scrollRestoration = 'manual';
      function resetHomepageScroll() {
        var previousScrollBehavior = document.documentElement.style.scrollBehavior;
        document.documentElement.style.scrollBehavior = 'auto';
        window.scrollTo(0, 0);
        document.documentElement.style.scrollBehavior = previousScrollBehavior;
      }

      resetHomepageScroll();
      window.addEventListener('pageshow', function resetHomepageScroll() {
        var previousScrollBehavior = document.documentElement.style.scrollBehavior;
        document.documentElement.style.scrollBehavior = 'auto';
        window.scrollTo(0, 0);
        document.documentElement.style.scrollBehavior = previousScrollBehavior;
      }, { once: true });
    }
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
